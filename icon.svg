<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#007AFF" rx="180" ry="180"/>

  <!-- Fraction display -->
  <g transform="translate(512, 512)">
    <!-- Numerator 1 -->
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#FFFFFF">1</text>

    <!-- Fraction bar -->
    <rect x="-200" y="-40" width="400" height="20" fill="#FFFFFF" rx="10"/>

    <!-- Denominator 2 -->
    <text x="0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#FFFFFF">2</text>
  </g>

  <!-- Subtle calculator hint at bottom -->
  <g transform="translate(512, 850)" opacity="0.3">
    <rect x="-200" y="0" width="400" height="120" fill="#FFFFFF" rx="20"/>
    <circle cx="-100" cy="60" r="30" fill="#007AFF"/>
    <circle cx="0" cy="60" r="30" fill="#007AFF"/>
    <circle cx="100" cy="60" r="30" fill="#007AFF"/>
  </g>
</svg>